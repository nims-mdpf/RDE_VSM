[tox]
skipsdist = True
envlist =
    py312-{module,flake8,lizard,mypy,ruff}
    flake8
    mypy
    ruff
skip_missing_interpreters = True

[testenv:py312-module]
deps = -rrequirements-test.txt
commands =
    python3 -m pytest \
      --cov-config=pyproject.toml \
      --cov=modules \
      --cov=modules_vsm \
      --cov-report=html \
      --cov-report=xml \
      --cov-report=term-missing \
      tests

[testenv:flake8]
skip_install = true
deps = -rrequirements-test.txt
commands =
  pflake8 main.py modules modules_vsm

[testenv:py312-flake8]
skip_install = true
deps = -rrequirements-test.txt
commands =
  pflake8 main.py modules modules_vsm

[testenv:lizard]
skip_install = true
deps = -rrequirements-test.txt
commands =
  lizard main.py modules modules_vsm -C 13

[testenv:py312-lizard]
skip_install = true
deps = -rrequirements-test.txt
commands =
  lizard main.py modules modules_vsm -C 13

[testenv:mypy]
skip_install = true
deps = -rrequirements-test.txt
commands =
  mypy main.py modules modules_vsm

[testenv:py312-mypy]
skip_install = true
deps = -rrequirements-test.txt
commands =
  mypy main.py modules modules_vsm

[testenv:ruff]
skip_install = true
deps = -rrequirements-test.txt
commands =
  ruff check main.py modules modules_vsm

[testenv:py312-ruff]
skip_install = true
deps = -rrequirements-test.txt
commands =
  ruff check main.py modules modules_vsm
